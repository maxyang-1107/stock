name: JP KR Morning Summary

on:
  schedule:
    # UTC 01:00 = 台灣時間 09:00, 週一到週五
    # (日韓 08:00 開盤,設在 09:00 才抓得到開盤後約 1 小時的盤中走勢)
    - cron: '0 1 * * 1-5'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python main.py jpkr_morning
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
